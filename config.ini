; Configuração do Sistema de Consulta de Recibos - LIVE Roupas Esportivas
;
; Qualquer chave aqui pode ser sobrescrita por variável de ambiente,
; usando o prefixo CONSULTA_RECIBOS_ + NOME_DA_CHAVE em maiúsculas.
; Exemplo: a chave "pasta_origem" da seção [origem] pode ser sobrescrita
; pela variável de ambiente CONSULTA_RECIBOS_PASTA_ORIGEM.
; Isso permite apontar para o caminho real do OneDrive em produção sem
; editar este arquivo.

[origem]
; Pasta onde ficam as planilhas mensais "FLUXO DE CAIXA ... 2026 ... LIVE.xlsx".
; Valor abaixo aponta para a cópia local já presente neste repositório,
; útil para desenvolvimento/teste. Em produção, trocar para o caminho real:
; C:\Users\<usuario>\OneDrive - LIVE ROUPAS ESPORTIVAS\Setor Financeiro - General\EXTRATO BRADESCO\FLUXO DE CAIXA LIVE ROUPAS 2026
pasta_origem = db/FLUXO DE CAIXA LIVE ROUPAS 2026

; Ano que deve constar no nome do arquivo para ser considerado.
ano = 2026

; Nome exato da aba a ser lida em cada planilha.
aba = Livro

[filtros]
; Prefixo de CONTA que identifica recebimento de clientes (RN-01).
conta_prefixo = 1000

; Prefixos de SUBCONTA aceitos, separados por vírgula (RN-01).
subconta_prefixos = 1076,1050

[banco]
; Banco aceito na importação (RN-08). Comparação é tolerante a
; maiúsculas/minúsculas e espaços (ver sync.py).
banco_aceito = ITAU 14444

[banco_dados]
; Caminho do arquivo SQLite gerado pelo sincronizador e usado pela API.
caminho_db = db/recibos.db
